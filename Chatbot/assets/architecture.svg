<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="lambdaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FB923C"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer AWS Cloud Boundary Box -->
  <rect x="250" y="45" width="460" height="430" rx="14" fill="#0B132B" fill-opacity="0.6" stroke="#F59E0B" stroke-dasharray="6,6" stroke-width="1.8"/>
  <text x="270" y="75" fill="#FBBF24" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AWS CLOUD (ap-south-1 Mumbai)</text>

  <!-- Title & Subtitle -->
  <text x="480" y="32" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">SERVERLESS AI CHATBOT ARCHITECTURE</text>

  <!-- 1. CLIENT CARD (Left) -->
  <g transform="translate(30, 200)" filter="url(#cardShadow)">
    <rect width="180" height="150" rx="12" fill="url(#clientGrad)" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="90" cy="42" r="22" fill="#1E293B" fill-opacity="0.6"/>
    <!-- Desktop / Browser Icon -->
    <path d="M78 35 h24 v14 h-24 z M85 49 v4 h10 v-4" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <text x="90" y="86" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client Browser</text>
    <text x="90" y="106" fill="#93C5FD" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">HTML5 / CSS3 / Vanilla JS</text>
    <text x="90" y="124" fill="#BFDBFE" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Responsive Web UI</text>
  </g>

  <!-- 2. AMAZON S3 CARD (Top Inside AWS) -->
  <g transform="translate(280, 105)" filter="url(#cardShadow)">
    <rect width="180" height="135" rx="12" fill="url(#s3Grad)" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="20" fill="#1E293B" fill-opacity="0.6"/>
    <!-- S3 Bucket Icon -->
    <path d="M78 30 h24 l-3 18 h-18 z M75 30 a15 4 0 0 0 30 0" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="90" y="80" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Amazon S3</text>
    <text x="90" y="98" fill="#FDE68A" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">serverless-chatbot-ui-001</text>
    <text x="90" y="115" fill="#FEF3C7" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Static Website Hosting</text>
  </g>

  <!-- 3. API GATEWAY CARD (Bottom Left Inside AWS) -->
  <g transform="translate(280, 290)" filter="url(#cardShadow)">
    <rect width="180" height="145" rx="12" fill="url(#apiGrad)" stroke="#F472B6" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="20" fill="#1E293B" fill-opacity="0.6"/>
    <!-- API Gateway Icon -->
    <path d="M80 34 h20 v12 h-20 z M86 30 l4 -4 l4 4" fill="none" stroke="#F472B6" stroke-width="2"/>
    <text x="90" y="78" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Amazon API Gateway</text>
    <text x="90" y="96" fill="#FBCFE8" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">REST API (/serverless-chatbot)</text>
    <text x="90" y="114" fill="#FCE7F3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">OPTIONS (CORS) &amp; POST</text>
    <text x="90" y="128" fill="#FCE7F3" font-family="Inter, sans-serif" font-size="9.5" text-anchor="middle">Lambda Proxy Integration</text>
  </g>

  <!-- 4. AWS LAMBDA CARD (Right Inside AWS) -->
  <g transform="translate(505, 290)" filter="url(#cardShadow)">
    <rect width="180" height="145" rx="12" fill="url(#lambdaGrad)" stroke="#FB923C" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="20" fill="#1E293B" fill-opacity="0.6"/>
    <!-- Lambda Icon (λ) -->
    <text x="90" y="46" fill="#FB923C" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">λ</text>
    <text x="90" y="78" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AWS Lambda</text>
    <text x="90" y="96" fill="#FED7AA" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">serverless-chatbot (Python)</text>
    <text x="90" y="114" fill="#FFEDD5" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Preflight + REST Request</text>
    <text x="90" y="128" fill="#FFEDD5" font-family="Inter, sans-serif" font-size="9.5" text-anchor="middle">Zero 3rd-Party Dependencies</text>
  </g>

  <!-- 5. GOOGLE GEMINI CARD (Far Right Outside AWS) -->
  <g transform="translate(750, 290)" filter="url(#cardShadow)">
    <rect width="180" height="145" rx="12" fill="url(#geminiGrad)" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="20" fill="#1E293B" fill-opacity="0.6"/>
    <!-- AI Sparkle / Brain Icon -->
    <path d="M90 26 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#A78BFA"/>
    <text x="90" y="78" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Google Gemini API</text>
    <text x="90" y="96" fill="#DDD6FE" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle">gemini-2.5-flash</text>
    <text x="90" y="114" fill="#EDE9FE" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM Content Generation</text>
    <text x="90" y="128" fill="#EDE9FE" font-family="Inter, sans-serif" font-size="9.5" text-anchor="middle">HTTPS REST Invocation</text>
  </g>

  <!-- FLOW ARROWS & LABELS -->
  
  <!-- Flow 1: Client -> S3 (Fetch static website) -->
  <path d="M 120 200 C 120 155, 200 155, 275 155" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="130" width="105" height="20" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="192" y="144" fill="#38BDF8" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">1. Get HTML/CSS/JS</text>

  <!-- Flow 2: Client -> API Gateway (Send Message) -->
  <path d="M 210 330 L 275 330" fill="none" stroke="#F472B6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="218" y="310" width="50" height="18" rx="4" fill="#0F172A" stroke="#F472B6" stroke-width="1"/>
  <text x="243" y="323" fill="#F472B6" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">2. POST</text>

  <!-- Flow 3: API Gateway -> Lambda -->
  <path d="M 460 360 L 500 360" fill="none" stroke="#FB923C" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="465" y="342" width="30" height="16" rx="4" fill="#0F172A" stroke="#FB923C" stroke-width="1"/>
  <text x="480" y="354" fill="#FB923C" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">3. Proxy</text>

  <!-- Flow 4: Lambda -> Gemini -->
  <path d="M 685 360 L 745 360" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="693" y="342" width="45" height="16" rx="4" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
  <text x="715" y="354" fill="#C084FC" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">4. Invoke</text>

</svg>
